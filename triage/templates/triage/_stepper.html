<ol class="wizard" aria-label="Étapes de l'évaluation">
  <li class="{% if step > 1 %}done{% elif step == 1 %}current{% endif %}"><span>{% if step > 1 %}<i class="bi bi-check-lg"></i>{% else %}1{% endif %}</span> Contexte</li>
  <li class="{% if step > 2 %}done{% elif step == 2 %}current{% endif %}"><span>{% if step > 2 %}<i class="bi bi-check-lg"></i>{% else %}2{% endif %}</span> Symptômes</li>
  <li class="{% if step > 3 %}done{% elif step == 3 %}current{% endif %}"><span>{% if step > 3 %}<i class="bi bi-check-lg"></i>{% else %}3{% endif %}</span> Vérification</li>
  <li class="{% if step == 4 %}current{% endif %}"><span>4</span> Résultat</li>
</ol>
