{% extends "core/auth/_layout.html" %}

{% block title %}Mot de passe modifié{% endblock %}

{% block content %}
<div class="auth-box">
  <div class="auth-card" style="text-align:center">
    <span class="icon-badge icon-badge-solid" style="margin:0 auto 1rem"><i class="bi bi-check-lg"></i></span>
    <h1 style="font-size:1.5rem">Mot de passe modifié</h1>
    <p class="text-muted">Votre mot de passe a bien été mis à jour. Vous pouvez maintenant vous connecter.</p>
    <a href="{% url 'login' %}" class="btn btn-primary btn-block">Se connecter</a>
  </div>
</div>
{% endblock %}
