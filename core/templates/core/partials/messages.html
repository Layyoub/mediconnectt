{% if messages %}
<div class="messages" role="status">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }}">
    <i class="bi {% if message.tags == 'success' %}bi-check-circle{% elif message.tags == 'error' %}bi-exclamation-octagon{% else %}bi-info-circle{% endif %}"></i>
    <p>{{ message }}</p>
  </div>
  {% endfor %}
</div>
{% endif %}
